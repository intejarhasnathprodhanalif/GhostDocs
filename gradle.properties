# ============================================================
# GhostDocs — Project-Wide Gradle Properties
# ============================================================

# JVM heap size — 4 GB keeps OpenCV AAR linking fast
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallelise task execution across modules
org.gradle.parallel=true

# Cache task outputs between builds
org.gradle.caching=true

# Recommended: configuration caching (safe for this project)
org.gradle.configuration-cache=false

# AndroidX & Jetifier — required for Firebase / ML Kit compat
android.useAndroidX=true
android.enableJetifier=true

# Suppress Kotlin stdlib warnings (we are 100% Java, but Firebase pulls Kotlin)
kotlin.stdlib.default.dependency=false


# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
